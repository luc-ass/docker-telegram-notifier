# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # The init, autobuild and analyze steps have to run the same version of
      # the action, or CodeQL stops with a configuration error. One pull
      # request per step can therefore never pass its own checks, so they are
      # updated together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Node 24 dropped 32-bit ARM, so a major bump of the base image silently
      # breaks the linux/arm/v7 build. Major updates are a deliberate decision
      # here and have to be made by hand, together with the platforms list in
      # .github/workflows/docker-image.yml.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
